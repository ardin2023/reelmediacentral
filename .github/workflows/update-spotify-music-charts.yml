name: Update Spotify Music Charts

on:
  schedule:
    - cron: "0 10 * * 1"  # Every Monday at 10:00 AM UTC
  workflow_dispatch:       # Allow manual runs from the Actions tab

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Spotify Global Music Charts
        run: python frontend/scripts/fetchSpotifyCharts.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/music-charts-global.json
          git diff --cached --quiet || git commit -m "chore: update Spotify Global Music Charts [skip ci]"
          git push
